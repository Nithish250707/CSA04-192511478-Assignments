# Horizontal Pod Autoscaler: keep 3 pods normally, grow to 6 when average CPU > 50% of the
# 250m request. Needs metrics-server (minikube addons enable metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result-portal
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
